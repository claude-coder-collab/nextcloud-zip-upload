name: E2E

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build app assets
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Start Nextcloud
        run: docker compose -f e2e/docker-compose.yml up -d

      - name: Debug mount permissions
        run: |
          sleep 3
          docker compose -f e2e/docker-compose.yml exec -T nextcloud id www-data
          docker compose -f e2e/docker-compose.yml exec -T nextcloud stat /var/www/html/custom_apps
          docker compose -f e2e/docker-compose.yml exec -T nextcloud stat /var/www/html/custom_apps/zip_upload
          docker compose -f e2e/docker-compose.yml exec -T nextcloud ls -la /var/www/html/custom_apps/

      - name: Wait for Nextcloud to be ready
        run: |
          for i in $(seq 1 10); do
            if curl -sf http://localhost:8080/status.php > /dev/null; then
              echo "Nextcloud is up"
              exit 0
            fi
            sleep 2
          done
          echo "Nextcloud did not become ready in time" >&2
          docker compose -f e2e/docker-compose.yml logs
          exit 1

      - name: Enable the app
        run: docker compose -f e2e/docker-compose.yml exec -T nextcloud php occ app:enable zip_upload

      - name: Run Playwright tests
        run: npm run test:e2e
        env:
          NEXTCLOUD_URL: http://localhost:8080
          NEXTCLOUD_ADMIN_USER: admin
          NEXTCLOUD_ADMIN_PASSWORD: admin

      - name: Show Nextcloud logs on failure
        if: failure()
        run: docker compose -f e2e/docker-compose.yml logs

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Stop Nextcloud
        if: always()
        run: docker compose -f e2e/docker-compose.yml down -v
