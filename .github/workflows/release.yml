name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm test

      - name: Check tag matches appinfo/info.xml version
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          app_version=$(sed -n 's/.*<version>\(.*\)<\/version>.*/\1/p' appinfo/info.xml)
          if [ "$tag_version" != "$app_version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match appinfo/info.xml version $app_version" >&2
            exit 1
          fi

      - run: npm run package

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.tar.gz \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
